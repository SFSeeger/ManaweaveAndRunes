name: Build

on:
  push:
    tags:
      - '1.[0-9]+.[0-9]+-[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check version numbers
        run: |
          TAG_REF=${GITHUB_REF#refs/tags/}
          echo "TAG_REF=$TAG_REF" >> "$GITHUB_ENV"
          chmod +x $GITHUB_WORKSPACE/version-check.sh
          $GITHUB_WORKSPACE/version-check.sh $TAG_REF
          {
            echo "CHANGELOG<<EOF"
            echo "## What is new in ${TAG_REF}"
            sed -n "/^##.*${TAG_REF}/,/^##/ { /^##.*${TAG_REF}/d; /^##/!p; }" $GITHUB_WORKSPACE/CHANGELOG.md
            echo EOF
          } >> "$GITHUB_ENV"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install UV
        run: "curl -LsSf https://astral.sh/uv/install.sh | sh"

      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          arguments: build

      - name: Upload artifact
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/libs/manaweave_and_runes-${{ env.TAG_REF }}.jar
            LICENSE.txt
          body: ${{ env.CHANGELOG }}
          make_latest: true
          fail_on_unmatched_files: true

      - name: Create release on modrinth
        run: "uv run scripts/upload_artifact/main.py"
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG_REF: ${{ env.TAG_REF }}
          CHANGELOG: ${{ env.CHANGELOG }}
          MODRINTH_API_KEY: ${{ secrets.MODRINTH_API_KEY }}
          MODRINTH_PROJECT_ID: ${{ vars.modrinth_project_id }}
          MODRINTH_API_URL: 'https://api.modrinth.com/v2/version'
          VERSION_TYPE: 'release'